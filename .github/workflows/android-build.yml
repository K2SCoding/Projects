name: Broomstick League — Android build

on:
  push:
    branches: [main]
    paths:
      - "broomstick-league/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "broomstick-league/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broomstick-league/android-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        # ubuntu-latest runners ship with an Android SDK preinstalled and
        # ANDROID_HOME/ANDROID_SDK_ROOT already exported. We only need to
        # accept the licenses here; the Gradle Android plugin auto-downloads
        # whatever compileSdk/build-tools packages it actually needs during
        # the build. (android-actions/setup-android@v3 tries to install the
        # legacy "tools" SDK package as part of its own setup, which Google
        # removed from the SDK repository — that fails the step outright.)
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort -r | head -n1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor (copies the web build into the native shell)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Point Gradle at the runner's SDK
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

      - name: Build debug APK
        working-directory: broomstick-league/android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: broomstick-league-debug-apk
          path: broomstick-league/android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
